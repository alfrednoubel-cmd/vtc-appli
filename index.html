<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Gestion VTC</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1d4ed8"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#f4f5f7;--c:#fff;--t:#14181f;--m:#667085;--p:#1d4ed8;--b:#e2e5ea;--ok:#15803d;--ko:#b91c1c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--c:#181d25;--t:#eef0f3;--m:#98a2b3;--p:#6b9bff;--b:#2a313c;--ok:#4ade80;--ko:#f87171;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--t)}
main{padding:12px 12px 90px;max-width:900px;margin:auto}h2{margin:6px 0 10px}h3{margin:0 0 8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--m);padding:7px 0;font-size:11px}nav button.a{color:var(--p);font-weight:700}nav span{display:block;font-size:20px}
.k{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.grid .k{margin:0}.grid b{font-size:18px;display:block}small,.m{color:var(--m)}
button{font:inherit;border-radius:10px;padding:9px 13px;border:1px solid var(--b);background:var(--c);color:var(--t)}button.p{background:var(--p);color:#fff;border-color:var(--p)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tag{font-size:12px;border:1px solid var(--b);border-radius:20px;padding:1px 8px;color:var(--m)}
input,select,textarea{width:100%;font:inherit;padding:9px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);margin:3px 0 8px}label{font-size:13px;color:var(--m);display:block}
.m{position:fixed;inset:0;background:#0008;z-index:10;overflow:auto;padding:12px}.mc{background:var(--c);border-radius:14px;padding:14px;max-width:520px;margin:20px auto}
.bar{display:flex;align-items:flex-end;gap:3px;height:90px}.bar i{flex:1;background:var(--p);border-radius:3px 3px 0 0;min-height:2px}
#doc{position:fixed;inset:0;background:#fff;color:#000;overflow:auto;padding:16px;z-index:20;font-size:14px}#doc:empty{display:none}#doc table{width:100%;border-collapse:collapse}#doc td,#doc th{border:1px solid #bbb;padding:6px;text-align:left}
@media print{body>*:not(#doc){display:none!important}#doc .np{display:none}}
</style></head><body><main id="v"></main><nav id="n"></nav><div id="md"></div><div id="doc"></div>
<script>
const $=s=>document.querySelector(s),E=e=>String(e??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=c=>(c/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €',cts=v=>Math.round(parseFloat(String(v).replace(',','.')||0)*100);
const f=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),today=()=>f(new Date()),fd=d=>d?d.split('-').reverse().join('/'):'',uid=()=>Math.random().toString(36).slice(2,9);
const now=()=>f(new Date())+' '+new Date().toTimeString().slice(0,5);
const init=()=>({set:{regime:'franchise',tva:10,mention:'TVA non applicable, article 293 B du CGI',cond:'Paiement à réception',delai:0,pen:'Pénalités de retard : 3 fois le taux d\'intérêt légal. Indemnité forfaitaire de recouvrement : 40 €.'},cl:[],rs:[],dc:[],py:[],sq:{},lg:[]});
let S;try{S=JSON.parse(localStorage.getItem('vtc'))||init()}catch(e){S=init()}
const save=()=>{try{localStorage.setItem('vtc',JSON.stringify(S))}catch(e){}},L=m=>{S.lg.unshift(now()+' '+m);S.lg.length=Math.min(S.lg.length,100);save()};
const nx=t=>{const y=new Date().getFullYear(),k=t+y;S.sq[k]=(S.sq[k]||0)+1;return t+'-'+y+'-'+String(S.sq[k]).padStart(4,'0')};
let V='home',per='m',q='',lm='';
const paid=d=>S.py.filter(p=>p.d===d.id).reduce((a,p)=>a+p.m,0);
const st=d=>d.t==='AV'?'Avoir':d.av?'Annulée par avoir':paid(d)>=d.tot?'Payée':paid(d)>0&&today()<=d.ech?'Partielle':today()>d.ech?'En retard':'Non payée';
const start=p=>{const n=new Date(),y=n.getFullYear(),m=n.getMonth();if(p==='j')return today();if(p==='s'){const d=new Date(n);d.setDate(n.getDate()-((n.getDay()+6)%7));return f(d)}if(p==='m')return f(new Date(y,m,1));if(p==='t')return f(new Date(y,m-m%3,1));return f(new Date(y,0,1))};
function modal(h){$('#md').innerHTML='<div class=m><div class=mc>'+h+'</div></div>'}const cm=()=>$('#md').innerHTML='';
function form(title,fs,v,ok,extra=''){modal('<h3>'+title+'</h3><form id=f>'+fs.map(g=>{const x=v[g.k]??g.d??'';let i;
if(g.o)i='<select name='+g.k+'>'+g.o.map(o=>'<option value="'+E(o[0])+'"'+(String(o[0])===String(x)?' selected':'')+'>'+E(o[1])+'</option>').join('')+'</select>';
else if(g.t==='area')i='<textarea name='+g.k+' rows=3>'+E(x)+'</textarea>';
else i='<input name='+g.k+' type='+(g.t||'text')+' value="'+E(x)+'"'+(g.t==='number'?' step=0.01 inputmode=decimal':'')+'>';
return '<label>'+g.l+i+'</label>'}).join('')+'<div class=row><button type=button data-c=cm>Annuler</button><button class=p>Enregistrer</button>'+extra+'</div></form>');
$('#f').onsubmit=e=>{e.preventDefault();const o={};new FormData(e.target).forEach((a,k)=>o[k]=a);if(ok(o)!==false){cm();render()}}}
const clName=c=>c.soc||c.nom;
// ---- Réservations
function eR(id){const r=S.rs.find(x=>x.id===id)||{};const v={...r,prix:(r.prix||0)/100,supp:(r.supp||0)/100};
form(id?'Modifier la réservation':'Nouvelle réservation',[{k:'cl',l:'Client enregistré',o:[['','— aucun —'],...S.cl.filter(c=>!c.arch).map(c=>[c.id,clName(c)])]},{k:'nom',l:'Nom du client'},{k:'tel',l:'Téléphone',t:'tel'},{k:'date',l:'Date de la prestation',t:'date',d:today()},{k:'h',l:'Heure de prise en charge',t:'time',d:'09:00'},{k:'dep',l:'Adresse de départ'},{k:'arr',l:'Adresse d\'arrivée'},{k:'pax',l:'Passagers',t:'number',d:1},{k:'type',l:'Type de prestation',o:['Transfert','Transfert aéroport/gare','Mise à disposition','Autre'].map(x=>[x,x]),d:'Transfert'},{k:'prix',l:'Prix convenu (€)',t:'number'},{k:'supp',l:'Suppléments (€)',t:'number'},{k:'pm',l:'Paiement prévu',o:['Espèces','Carte bancaire','Virement','Lien de paiement','Plateforme'].map(x=>[x,x])},{k:'st',l:'Statut',o:['en attente','confirmée','effectuée','annulée'].map(x=>[x,x]),d:'en attente'},{k:'note',l:'Informations complémentaires',t:'area'}],v,o=>{const c=S.cl.find(x=>x.id===o.cl)||{};
const n={...r,id:r.id||uid(),cr:r.cr||now(),cl:o.cl,nom:o.nom||(c.id?clName(c):''),tel:o.tel||c.tel||'',date:o.date,h:o.h,dep:o.dep,arr:o.arr,pax:+o.pax||1,type:o.type,prix:cts(o.prix),supp:cts(o.supp),pm:o.pm,st:o.st,note:o.note};
if(!n.nom||!n.tel){alert('Nom et téléphone du client obligatoires');return false}
id?S.rs[S.rs.findIndex(x=>x.id===id)]=n:S.rs.push(n);L('Réservation '+(id?'modifiée':'créée')+' : '+n.nom)},id&&!r.fac?'<button type=button data-c="delR|'+id+'">Supprimer</button>':'')}
function delR(id){if(confirm('Supprimer cette réservation ?')){S.rs=S.rs.filter(x=>x.id!==id);L('Réservation supprimée');cm();render()}}
function dup(id){const r={...S.rs.find(x=>x.id===id),id:uid(),cr:now(),bc:null,fac:null,st:'en attente',date:today()};S.rs.push(r);L('Réservation dupliquée');eR(r.id)}
function bon(id){const r=S.rs.find(x=>x.id===id);if(!r.bc){r.bc=nx('BC');save()}const s=S.set;
$('#doc').innerHTML='<div class=np><button data-c=prt>Imprimer / PDF</button> <button data-c=cd>Fermer</button> <a href="mailto:?subject=Bon de commande '+r.bc+'">✉ E-mail</a></div><h2>Justificatif de réservation préalable<br>'+r.bc+'</h2><p><b>Exploitant :</b> '+E(s.comm||s.nom)+'<br>'+E(s.adr)+'<br>Tél. '+E(s.tel)+' · '+E(s.email)+'<br>Inscription registre VTC : '+E(s.vtc)+'<br>SIREN : '+E(s.siren)+'</p><p><b>Client :</b> '+E(r.nom)+' · Tél. '+E(r.tel)+'</p><table><tr><th>Réservation effectuée le</th><td>'+fd(r.cr.slice(0,10))+' à '+r.cr.slice(11)+'</td></tr><tr><th>Prise en charge souhaitée</th><td>'+fd(r.date)+' à '+E(r.h)+'</td></tr><tr><th>Lieu de prise en charge</th><td>'+E(r.dep)+'</td></tr><tr><th>Destination</th><td>'+E(r.arr)+'</td></tr><tr><th>Passagers / prestation</th><td>'+r.pax+' · '+E(r.type)+'</td></tr><tr><th>Prix convenu</th><td>'+eur(r.prix+r.supp)+' ('+E(r.pm)+')</td></tr></table><p class=np><small>Vérifiez les mentions obligatoires de l\'arrêté applicable avant usage.</small></p>'}
// ---- Factures
function mkF(o){const s=S.set,tva=s.regime==='tva',tv=tva?Math.round(o.ht*s.tva/100):0,d=new Date();d.setDate(d.getDate()+(+s.delai||0));
const x={id:uid(),t:'F',num:nx('F'),date:today(),dp:o.dp,cl:o.cl,nom:o.nom,adr:o.adr||'',pro:o.pro,siret:o.siret||'',desc:o.desc,ht:o.ht,tv,tot:o.ht+tv,reg:s.regime,rate:s.tva,ment:s.mention,ech:f(d),res:o.res};S.dc.push(x);L('Facture émise '+x.num);return x}
function fac(rid){const r=S.rs.find(x=>x.id===rid);if(r.fac)return doc(r.fac);const c=S.cl.find(x=>x.id===r.cl)||{};
const x=mkF({dp:r.date,cl:r.cl,nom:r.nom,adr:c.fadr||c.adr,pro:c.pro==='1',siret:c.siret,desc:r.type+' : '+r.dep+' → '+r.arr+' le '+fd(r.date)+' à '+r.h,ht:r.prix+r.supp,res:rid});r.fac=x.id;save();render();doc(x.id)}
function eF(){form('Facture manuelle',[{k:'cl',l:'Client',o:[['','— saisie libre —'],...S.cl.filter(c=>!c.arch).map(c=>[c.id,clName(c)])]},{k:'nom',l:'Nom si saisie libre'},{k:'dp',l:'Date de la prestation',t:'date',d:today()},{k:'desc',l:'Description de la prestation'},{k:'ht',l:'Montant HT (€)',t:'number'}],{},o=>{const c=S.cl.find(x=>x.id===o.cl)||{},nom=c.id?clName(c):o.nom;if(!nom||!o.desc||cts(o.ht)<=0){alert('Client, description et montant requis');return false}
mkF({dp:o.dp,cl:o.cl,nom,adr:c.fadr||c.adr,pro:c.pro==='1',siret:c.siret,desc:o.desc,ht:cts(o.ht)})})}
function pay(id){const d=S.dc.find(x=>x.id===id);form('Encaissement '+d.num,[{k:'m',l:'Montant reçu (€)',t:'number',d:(d.tot-paid(d))/100},{k:'date',l:'Date',t:'date',d:today()},{k:'mode',l:'Mode',o:['Espèces','Carte bancaire','Virement','Lien de paiement','Plateforme'].map(x=>[x,x])},{k:'ref',l:'Référence du paiement'}],{},o=>{const m=cts(o.m);if(m<=0)return false;S.py.push({id:uid(),d:id,date:o.date,m,mode:o.mode,ref:o.ref});L('Paiement '+eur(m)+' sur '+d.num)})}
function avoir(id){const d=S.dc.find(x=>x.id===id);form('Avoir sur '+d.num,[{k:'mt',l:'Motif de l\'avoir'}],{},o=>{const a={...d,id:uid(),t:'AV',num:nx('AV'),date:today(),ht:-d.ht,tv:-d.tv,tot:-d.tot,ref:d.num,desc:'Avoir sur '+d.num+' — '+o.mt,av:null};S.dc.push(a);d.av=a.id;L('Avoir '+a.num+' sur '+d.num)})}
function doc(id){const d=S.dc.find(x=>x.id===id),s=S.set,av=d.t==='AV';
$('#doc').innerHTML='<div class=np><button data-c=prt>Imprimer / PDF</button> <button data-c=cd>Fermer</button> <a href="mailto:?subject='+(av?'Avoir ':'Facture ')+d.num+'">✉ E-mail</a></div><h2>'+(av?'AVOIR ':'FACTURE ')+d.num+'</h2><p><b>'+E(s.nom)+'</b> — Entrepreneur individuel (EI)'+(s.comm?' · '+E(s.comm):'')+'<br>'+E(s.adr)+'<br>SIREN '+E(s.siren)+' · Tél. '+E(s.tel)+'</p><p>Émise le '+fd(d.date)+' · Prestation du '+fd(d.dp)+(d.ref?' · Réf. facture '+d.ref:'')+'</p><p><b>Client :</b> '+E(d.nom)+'<br>'+E(d.adr)+(d.siret?'<br>SIRET '+E(d.siret):'')+'</p><table><tr><th>Description</th><th>HT</th>'+(d.reg==='tva'?'<th>TVA '+d.rate+'%</th>':'')+'<th>Total</th></tr><tr><td>'+E(d.desc)+'</td><td>'+eur(d.ht)+'</td>'+(d.reg==='tva'?'<td>'+eur(d.tv)+'</td>':'')+'<td>'+eur(d.tot)+'</td></tr></table><p><b>Total à payer : '+eur(d.tot)+'</b></p>'+(d.reg==='tva'?'':'<p>'+E(d.ment)+'</p>')+'<p>'+E(s.cond)+(d.ech?' · Échéance '+fd(d.ech):'')+'</p>'+(d.pro?'<p>'+E(s.pen)+'</p>':'')+(s.iban?'<p>IBAN : '+E(s.iban)+'</p>':'')}
// ---- Clients
function eC(id){const c=S.cl.find(x=>x.id===id)||{};form(id?'Modifier le client':'Nouveau client',[{k:'pro',l:'Type',o:[['0','Particulier'],['1','Professionnel']]},{k:'nom',l:'Nom et prénom'},{k:'soc',l:'Société'},{k:'adr',l:'Adresse'},{k:'fadr',l:'Adresse de facturation'},{k:'tel',l:'Téléphone',t:'tel'},{k:'email',l:'E-mail',t:'email'},{k:'siret',l:'SIREN / SIRET'},{k:'note',l:'Informations',t:'area'}],c,o=>{if(!o.nom&&!o.soc)return false;const n={...c,...o,id:c.id||uid()};id?S.cl[S.cl.findIndex(x=>x.id===id)]=n:S.cl.push(n);L('Client '+(id?'modifié':'créé')+' : '+clName(n))},id?'<button type=button data-c="arch|'+id+'">'+(c.arch?'Désarchiver':'Archiver')+'</button>':'')}
function arch(id){const c=S.cl.find(x=>x.id===id);c.arch=!c.arch;L('Client archivé/désarchivé');cm();render()}
// ---- Vues
const V_={
home(){const s0=start(per),F=S.dc.filter(d=>d.t==='F'&&!d.av),ss=F.map(st),n=x=>ss.filter(y=>y===x).length;
const fc=S.dc.filter(d=>d.date>=s0).reduce((a,d)=>a+d.tot,0),enc=S.py.filter(p=>p.date>=s0).reduce((a,p)=>a+p.m,0),rest=F.reduce((a,d)=>a+Math.max(0,d.tot-paid(d)),0);
const ms=[...Array(12)].map((_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-11+i);const k=f(d).slice(0,7);return[k,S.py.filter(p=>p.date.slice(0,7)===k).reduce((a,p)=>a+p.m,0)]}),mx=Math.max(1,...ms.map(x=>x[1]));
const R=S.rs.filter(r=>r.date>=s0);
return '<h2>Tableau de bord</h2><select data-i=per>'+[['j','Jour'],['s','Semaine'],['m','Mois'],['t','Trimestre'],['a','Année']].map(o=>'<option value='+o[0]+(o[0]===per?' selected':'')+'>'+o[1]+'</option>').join('')+'</select><div class=grid>'+
[['CA facturé',eur(fc)],['CA encaissé',eur(enc)],['Courses effectuées',R.filter(r=>r.st==='effectuée').length],['Réservations à venir',S.rs.filter(r=>r.date>=today()&&['en attente','confirmée'].includes(r.st)).length],['Factures payées',n('Payée')],['En attente',n('Non payée')+n('Partielle')],['Impayées (retard)',n('En retard')],['Reste à encaisser',eur(rest)]].map(x=>'<div class=k><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('')+'</div><div class=k><small>Encaissements — 12 derniers mois</small><div class=bar>'+ms.map(x=>'<i title="'+x[0]+' '+eur(x[1])+'" style="height:'+Math.round(x[1]/mx*100)+'%"></i>').join('')+'</div></div><div class=k><b>Dernières réservations</b>'+[...S.rs].slice(-3).reverse().map(r=>'<br>'+fd(r.date)+' · '+E(r.nom)+' · '+r.st).join('')+'<br><br><b>Dernières factures</b>'+[...S.dc].slice(-3).reverse().map(d=>'<br>'+d.num+' · '+E(d.nom)+' · '+eur(d.tot)).join('')+'</div>'},
rs(){return '<h2>Réservations</h2><button class=p data-c=eR>+ Nouvelle réservation</button>'+([...S.rs].sort((a,b)=>(b.date+b.h).localeCompare(a.date+a.h)).map(r=>'<div class=k><b>'+fd(r.date)+' '+E(r.h)+'</b> · '+E(r.nom)+' <span class=tag>'+r.st+'</span><br><small>'+E(r.dep)+' → '+E(r.arr)+' · '+r.pax+' pers. · '+eur(r.prix+r.supp)+(r.bc?' · '+r.bc:'')+'</small><div class=row><button data-c="bon|'+r.id+'">Bon de commande</button><button data-c="fac|'+r.id+'">'+(r.fac?'Voir facture':'Facturer')+'</button>'+(r.fac?'':'<button data-c="eR|'+r.id+'">Modifier</button>')+'<button data-c="dup|'+r.id+'">Dupliquer</button></div></div>').join('')||'<p class=m>Aucune réservation.</p>')},
cl(){return '<h2>Clients</h2><button class=p data-c=eC>+ Nouveau client</button><input placeholder="Rechercher…" value="'+E(q)+'" data-i=q>'+(S.cl.filter(c=>(clName(c)+c.tel+c.email).toLowerCase().includes(q.toLowerCase())).map(c=>{const t=S.dc.filter(d=>d.cl===c.id).reduce((a,d)=>a+d.tot,0);return '<div class=k data-c="eC|'+c.id+'"><b>'+E(clName(c))+'</b> <span class=tag>'+(c.pro==='1'?'Pro':'Particulier')+(c.arch?' · archivé':'')+'</span><br><small>'+E(c.tel)+' · '+E(c.email)+' · '+S.rs.filter(r=>r.cl===c.id).length+' course(s) · facturé '+eur(t)+'</small></div>'}).join('')||'<p class=m>Aucun client.</p>')},
dc(){return '<h2>Factures et avoirs</h2><button class=p data-c=eF>+ Facture manuelle</button>'+([...S.dc].reverse().map(d=>'<div class=k><b>'+d.num+'</b> · '+fd(d.date)+' <span class=tag>'+st(d)+'</span><br>'+E(d.nom)+' · <b>'+eur(d.tot)+'</b>'+(d.t==='F'&&!d.av?' <small>(reste '+eur(Math.max(0,d.tot-paid(d)))+')</small>':'')+'<div class=row><button data-c="doc|'+d.id+'">Voir / PDF</button>'+(d.t==='F'&&!d.av?'<button data-c="pay|'+d.id+'">+ Paiement</button><button data-c="avoir|'+d.id+'">Avoir</button>':'')+'</div></div>').join('')||'<p class=m>Aucune facture.</p>')+'<p class=m><small>Une facture émise ne peut être ni modifiée ni supprimée : on la corrige par un avoir.</small></p>'},
lv(){const P=S.py.filter(p=>!lm||p.date.slice(0,7)===lm).sort((a,b)=>a.date.localeCompare(b.date)),D=id=>S.dc.find(x=>x.id===id)||{},by={};S.py.forEach(p=>by[p.date.slice(0,7)]=(by[p.date.slice(0,7)]||0)+p.m);
return '<h2>Livre des recettes</h2><label>Mois<input type=month value="'+lm+'" data-i=lm></label><div class=k><b>Total : '+eur(P.reduce((a,p)=>a+p.m,0))+'</b> <small>(encaissé, base de déclaration)</small></div><button data-c=csv>Exporter CSV</button>'+P.map(p=>'<div class=k><b>'+fd(p.date)+'</b> · '+D(p.d).num+' · '+E(D(p.d).nom)+'<br><small>'+E(D(p.d).desc)+'</small><br>'+eur(p.m)+' · '+E(p.mode)+' · '+E(p.ref)+'</div>').join('')+'<div class=k><b>Récapitulatif mensuel</b>'+Object.keys(by).sort().reverse().map(k=>'<br>'+k+' : '+eur(by[k])).join('')+'</div>'},
st(){const s=S.set;return '<h2>Paramètres</h2><div class=k>'+E(s.nom||'Entreprise non renseignée')+'<br><small>Régime : '+(s.regime==='tva'?'assujetti TVA '+s.tva+'%':'franchise en base')+' · SIREN '+E(s.siren)+'</small><div class=row><button class=p data-c=eS>Modifier</button><button data-c=bk>Sauvegarde / restauration</button></div></div><div class=k><b>Historique</b>'+S.lg.slice(0,15).map(l=>'<br><small>'+E(l)+'</small>').join('')+'</div><p class=m><small>Données stockées dans ce navigateur : pensez à copier une sauvegarde régulièrement. Vérifiez la mention de franchise de TVA et les mentions du bon de commande avec les textes officiels.</small></p>'}};
function eS(){form('Mon entreprise',[{k:'nom',l:'Nom et prénom'},{k:'comm',l:'Nom commercial'},{k:'adr',l:'Adresse professionnelle'},{k:'siren',l:'SIREN'},{k:'siret',l:'SIRET'},{k:'vtc',l:'N° registre des exploitants VTC'},{k:'tel',l:'Téléphone',t:'tel'},{k:'email',l:'E-mail pro',t:'email'},{k:'iban',l:'IBAN'},{k:'regime',l:'Régime de TVA',o:[['franchise','Franchise en base'],['tva','Assujetti à la TVA']]},{k:'tva',l:'Taux de TVA (%) si assujetti — prix saisis HT',t:'number'},{k:'mention',l:'Mention légale en franchise'},{k:'cond',l:'Conditions de paiement'},{k:'delai',l:'Délai de paiement (jours)',t:'number'},{k:'pen',l:'Pénalités (clients professionnels)',t:'area'}],S.set,o=>{S.set={...o,tva:+o.tva||0,delai:+o.delai||0};L('Paramètres modifiés')})}
function csv(){const D=id=>S.dc.find(x=>x.id===id)||{},P=S.py.filter(p=>!lm||p.date.slice(0,7)===lm).sort((a,b)=>a.date.localeCompare(b.date));
const t='Date;Facture;Client;Nature;Montant;Mode;Référence\n'+P.map(p=>[p.date,D(p.d).num,D(p.d).nom,D(p.d).desc,(p.m/100).toFixed(2).replace('.',','),p.mode,p.ref].map(x=>'"'+String(x||'').replace(/"/g,'""')+'"').join(';')).join('\n');
modal('<h3>Export CSV</h3><textarea id=tx rows=10>'+E(t)+'</textarea><div class=row><button class=p data-c=cp>Copier</button><button data-c=cm>Fermer</button></div>')}
function bk(){modal('<h3>Sauvegarde</h3><textarea id=tx rows=10>'+E(JSON.stringify(S))+'</textarea><div class=row><button class=p data-c=cp>Copier</button><button data-c=rst>Restaurer depuis le texte</button><button data-c=cm>Fermer</button></div>')}
function rst(){try{const o=JSON.parse($('#tx').value);if(!o.set||!o.dc)throw 0;if(confirm('Remplacer toutes les données ?')){S=o;save();cm();render()}}catch(e){alert('Sauvegarde invalide')}}
const T=[['home','📊','Accueil'],['rs','🚗','Résa'],['cl','👥','Clients'],['dc','🧾','Factures'],['lv','💶','Livre'],['st','⚙️','Réglages']];
function render(keep){$('#n').innerHTML=T.map(t=>'<button class="'+(V===t[0]?'a':'')+'" data-c="nav|'+t[0]+'"><span>'+t[1]+'</span>'+t[2]+'</button>').join('');
const fo=document.activeElement,pos=fo&&fo.selectionStart;$('#v').innerHTML=V_[V]();if(keep){const i=$('#v input');if(i){i.focus();i.setSelectionRange(pos,pos)}}else window.scrollTo(0,0)}
const A={eR,eC,eF,eS,csv,bk,rst,bon,fac,dup,doc,pay,avoir,delR,arch,cm,
prt:()=>window.print(),cd:()=>$('#doc').innerHTML='',
cp:()=>{const t=$('#tx');t.select();try{navigator.clipboard.writeText(t.value).catch(()=>0)}catch(e){}},
nav:v=>{V=v;render()}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-c]');if(!t)return;const[a,...r]=t.dataset.c.split('|');try{A[a](...r)}catch(x){alert('Erreur : '+x.message)}});
document.addEventListener('input',e=>{if(e.target.dataset.i==='q'){q=e.target.value;render(true)}});
document.addEventListener('change',e=>{const k=e.target.dataset.i;if(k==='per'){per=e.target.value;render()}if(k==='lm'){lm=e.target.value;render()}});
render();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>0));
